name: Update Stats

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Cloudflare analytics
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ZONE_ID: 38a3ef23e6a0bbea0bc2a0b49d8f53f7
        run: |
          python3 fetch_stats.py

      - name: Commit updated stats.json
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet && echo "No changes" || (git commit -m "Update stats snapshot" && git push)
